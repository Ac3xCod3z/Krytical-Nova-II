<meta charset="utf-8">
<title>Nova Dependency Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: the same comic book as the Encyclopedia of Nova. A score strip of the headline numbers, a sticky bar with
     search and the six views, and a reader that opens any system or class as its own page. The map stacks the systems
     in layers, users on top, foundations at the bottom, so a line that climbs is a reference running the wrong way. */
  :root {
    --paper: #f6efd9;
    --panel: #fffaf0;
    --ink: #14161c;
    --muted: #5b5a52;
    --line: #b9b19a;
    --dots: rgba(20, 22, 28, 0.10);
    --pop: #ffc928;
    --pop-ink: #14161c;
    --cyan: #138fa0;
    --cyan-soft: #bfe9ee;
    --magenta: #d42a5f;
    --magenta-soft: #ffd3df;
    --ok: #2f8f4e;
    --code: #ece3c6;
    --shadow: #14161c;
    --ochre: #b07a00;
    /* layers, bottom to top, and the waves of a ripple */
    --lay0: #5b6476; --lay1: #3a6fd0; --lay2: #9a7414; --lay3: #8b43b0; --lay4: #2f8f4e;
    --lay0-soft: #e3e6ec; --lay1-soft: #dbe6fb; --lay2-soft: #f4ead0; --lay3-soft: #eedff6; --lay4-soft: #d9f0e1;
    --w1: #ff8fae; --w2: #ffbfd0; --w3: #ffe2ea;
    --display: "Bangers", "Impact", sans-serif;
    --head: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141a2b; --panel: #1d2540; --ink: #f4eeda; --muted: #a9adc2; --line: #46507a; --dots: rgba(244, 238, 218, 0.07);
      --pop: #ffc928; --pop-ink: #14161c; --cyan: #3fd2e2; --cyan-soft: #17465a; --magenta: #ff5c8f; --magenta-soft: #4f1d33;
      --ok: #5fd08a; --code: #2a3357; --shadow: #05070d; --ochre: #f0b93a;
      --lay0: #a3adc2; --lay1: #7ea8ff; --lay2: #e2b75a; --lay3: #c99be4; --lay4: #5fd08a;
      --lay0-soft: #262f48; --lay1-soft: #1c2c52; --lay2-soft: #3a3020; --lay3-soft: #33224a; --lay4-soft: #1b3a2a;
      --w1: #a8335a; --w2: #702540; --w3: #4a1d30;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #141a2b; --panel: #1d2540; --ink: #f4eeda; --muted: #a9adc2; --line: #46507a; --dots: rgba(244, 238, 218, 0.07);
    --pop: #ffc928; --pop-ink: #14161c; --cyan: #3fd2e2; --cyan-soft: #17465a; --magenta: #ff5c8f; --magenta-soft: #4f1d33;
    --ok: #5fd08a; --code: #2a3357; --shadow: #05070d; --ochre: #f0b93a;
    --lay0: #a3adc2; --lay1: #7ea8ff; --lay2: #e2b75a; --lay3: #c99be4; --lay4: #5fd08a;
    --lay0-soft: #262f48; --lay1-soft: #1c2c52; --lay2-soft: #3a3020; --lay3-soft: #33224a; --lay4-soft: #1b3a2a;
    --w1: #a8335a; --w2: #702540; --w3: #4a1d30;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--paper); background-image: radial-gradient(var(--dots) 1.5px, transparent 1.6px); background-size: 14px 14px;
         color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
  p, ul, ol, h1, h2, h3, h4 { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
          padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 70px; display: flex; flex-direction: column; gap: 18px; }
  code, .path { font-family: var(--mono); font-size: 0.84em; background: var(--code); border-radius: 3px; padding: 0 4px; overflow-wrap: anywhere; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .tag { font-family: var(--head); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
         background: var(--ink); color: var(--paper); padding: 2px 10px; transform: skewX(-8deg); }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 7vw, 62px); line-height: 0.95; letter-spacing: 0.03em;
       color: var(--pop); -webkit-text-stroke: 2px var(--shadow); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--shadow); text-wrap: balance; }
  .lede { margin-top: 4px; max-width: 74ch; }

  .score { align-self: stretch; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 8px; border: 3px solid var(--ink);
           border-radius: 6px; box-shadow: 5px 5px 0 var(--shadow); overflow: hidden; background: var(--ink); gap: 3px; }
  .seg { display: flex; flex-direction: column; gap: 2px; padding: 7px 12px 8px; background: var(--panel); color: var(--ink); text-decoration: none; min-width: 0; }
  .seg b { font: 400 32px/1 var(--display); letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
  .seg span { font: 700 13px var(--head); letter-spacing: 0.08em; text-transform: uppercase; }
  .seg.bad { background: var(--magenta-soft); }
  .seg.warn { background: var(--pop); color: var(--pop-ink); }
  a.seg:hover { filter: brightness(1.05); }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 8px; background: var(--paper);
         background-image: radial-gradient(var(--dots) 1.5px, transparent 1.6px); background-size: 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab { font: 700 15px var(--head); letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; color: var(--ink); background: var(--panel);
         border: 2px solid var(--ink); border-radius: 5px; padding: 4px 11px; cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); }
  .tab:hover { background: var(--cyan-soft); }
  .tab[aria-current="page"] { background: var(--pop); color: var(--pop-ink); }
  .searchwrap { position: relative; }
  .searchwrap input { width: 100%; font: 500 16px var(--body); padding: 9px 14px; color: var(--ink); background: var(--panel);
                      border: 3px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--shadow); }
  .results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--panel); border: 3px solid var(--ink); border-radius: 6px;
             box-shadow: 5px 5px 0 var(--shadow); max-height: 60vh; overflow: auto; z-index: 30; }
  .results button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
                    padding: 7px 12px; cursor: pointer; }
  .results button:hover, .results button:focus-visible { background: var(--cyan-soft); }
  .results .kind { font: 700 12px var(--head); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); min-width: 52px; }

  .panel { background: var(--panel); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 5px 5px 0 var(--shadow); padding: 16px 18px; min-width: 0; }
  h2 { font: 400 30px/1 var(--display); letter-spacing: 0.04em; text-wrap: balance; }
  h3 { font: 700 18px var(--head); letter-spacing: 0.05em; text-transform: uppercase; }
  h4 { font: 700 15px var(--head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .prose { max-width: 76ch; display: flex; flex-direction: column; gap: 8px; }

  .chip { display: inline-flex; align-items: center; gap: 4px; font: 600 12.5px var(--head); letter-spacing: 0.05em; text-transform: uppercase;
          border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 6px; background: var(--panel); white-space: nowrap; }
  button.chip { cursor: pointer; }
  button.chip:hover { background: var(--cyan-soft); }
  .chip.on { background: var(--ink); color: var(--paper); }
  .chip.bad { background: var(--magenta); color: #fff; border-color: var(--magenta); }
  .chip.warn { background: var(--pop); color: var(--pop-ink); }
  .chip.good { background: var(--ok); color: #fff; border-color: var(--ok); }
  .chip.soft { border-color: var(--line); color: var(--muted); }
  .link { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-color: var(--cyan);
          text-decoration-thickness: 2px; text-underline-offset: 2px; text-align: left; }
  .link:hover { color: var(--cyan); }

  /* the map: systems in five layer bands, users on top. Hover previews a system's links, a click pins it; Ripple and
     Path are the two questions a refactor asks ("what does a change here reach?", "how does A get to B?"). */
  .mapgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .maptools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 4px 6px 0; }
  .seg-ctl { display: inline-flex; border: 2px solid var(--ink); border-radius: 5px; overflow: hidden; box-shadow: 3px 3px 0 var(--shadow); }
  .seg-ctl button { font: 700 14px var(--head); letter-spacing: 0.06em; text-transform: uppercase; background: var(--panel); border: 0; padding: 4px 11px; cursor: pointer; }
  .seg-ctl button + button { border-left: 2px solid var(--ink); }
  .seg-ctl button:hover { background: var(--cyan-soft); }
  .seg-ctl button[aria-pressed="true"] { background: var(--pop); color: var(--pop-ink); }
  .mapwrap { position: relative; overflow-x: auto; padding: 4px; touch-action: pan-y; }
  .mapwrap svg { display: block; min-width: 860px; width: 100%; height: auto; user-select: none; }
  .mapwrap.panning svg { cursor: grabbing; }
  .zoom { position: absolute; right: 12px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  .zoom button { width: 30px; height: 30px; font: 700 18px/1 var(--head); background: var(--panel); border: 2px solid var(--ink); border-radius: 5px; cursor: pointer; box-shadow: 2px 2px 0 var(--shadow); }
  .zoom button:hover { background: var(--cyan-soft); }
  .band { stroke: none; }
  .band-label { font: 700 11px var(--head); letter-spacing: 0.12em; text-transform: uppercase; }
  .band-sub { font: 500 10px var(--mono); fill: var(--muted); }
  .node { cursor: pointer; transition: opacity 0.25s; }
  .node rect.box { fill: var(--panel); stroke: var(--ink); stroke-width: 2; transition: fill 0.3s, stroke 0.2s; }
  .node rect.stripe { stroke: none; }
  .node rect.size { fill: var(--cyan-soft); }
  .node text { font: 700 13px var(--head); letter-spacing: 0.02em; fill: var(--ink); pointer-events: none; }
  .node text.sub { font: 500 10px var(--mono); fill: var(--muted); }
  .node .badge-bg { fill: var(--ink); opacity: 0; transition: opacity 0.2s; }
  .node .badge { font: 400 15px var(--display); fill: var(--paper); text-anchor: middle; opacity: 0; transition: opacity 0.2s; }
  .node.has-badge .badge, .node.has-badge .badge-bg { opacity: 1; }
  .node:hover rect.box, .node.sel rect.box, .node:focus-visible rect.box { stroke: var(--magenta); stroke-width: 3; }
  .node.dim { opacity: 0.22; }
  .node.off { opacity: 0.1; pointer-events: none; }
  .node.origin rect.box { fill: var(--pop); }
  .node.w1 rect.box { fill: var(--w1); }
  .node.w2 rect.box { fill: var(--w2); }
  .node.w3 rect.box { fill: var(--w3); }
  .node.onpath rect.box { fill: var(--cyan-soft); stroke: var(--cyan); stroke-width: 3; }
  .edge { fill: none; stroke: var(--line); opacity: 0.2; transition: opacity 0.25s, stroke 0.25s; }
  .edge.cold { opacity: 0.04; }
  .edge.hot { opacity: 0.95; }
  .edge.out { stroke: var(--cyan); }
  .edge.in { stroke: var(--ochre); }
  .edge.ripple { stroke: var(--magenta); }
  .edge.path { stroke: var(--cyan); }
  .edge.back { stroke: var(--magenta); opacity: 0.95; }
  .edge.up { stroke: var(--magenta); stroke-dasharray: 6 4; opacity: 0.95; }
  .edge.unseen { stroke: var(--muted); stroke-dasharray: 2 5; opacity: 0.55; }
  .edge.flow { stroke-dasharray: 9 6; animation: flow 0.9s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -15; } }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .edge-hit.off { pointer-events: none; }
  .tip { position: absolute; z-index: 5; pointer-events: none; background: var(--panel); border: 2px solid var(--ink); border-radius: 5px;
         box-shadow: 4px 4px 0 var(--shadow); padding: 7px 10px; font-size: 13px; max-width: 260px; }
  .tip b { font: 700 15px var(--head); letter-spacing: 0.03em; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; align-items: center; }
  .legend i { display: inline-block; width: 26px; height: 0; border-top: 3px solid var(--line); vertical-align: middle; margin-right: 6px; }
  .legend i.out { border-color: var(--cyan); }
  .legend i.in { border-color: var(--ochre); }
  .legend i.unseen { border-top: 3px dotted var(--muted); }
  .legend i.bad { border-top: 3px dashed var(--magenta); }
  .layerkey { display: flex; flex-direction: column; gap: 5px; }
  .layerkey button { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; background: none;
                     border: 1.5px solid var(--line); border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .layerkey button:hover { background: var(--cyan-soft); }
  .layerkey button[aria-pressed="false"] { opacity: 0.45; text-decoration: line-through; }
  .layerkey .sw { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--ink); }
  .wave { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: start; }
  .wave .n { font: 400 20px/1 var(--display); text-align: center; border: 2px solid var(--ink); border-radius: 4px; padding: 3px 0 1px; }
  .chain { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .health { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .health div { border: 2px solid var(--ink); border-radius: 5px; padding: 6px 9px; background: var(--paper); }
  .health b { display: block; font: 400 28px/1 var(--display); font-variant-numeric: tabular-nums; }
  .health span { font: 600 12px var(--head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .health .ok b { color: var(--ok); }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); max-height: calc(100vh - 130px); overflow: auto; }

  /* the matrix: rows use columns; a clean stack keeps every mark on one side of the diagonal */
  .matwrap { overflow-x: auto; position: relative; }
  .matwrap svg { display: block; }
  .mx-label { font: 600 12px var(--head); letter-spacing: 0.02em; fill: var(--ink); cursor: pointer; }
  .mx-label.hl { fill: var(--magenta); }
  .mx-cell { cursor: pointer; stroke: var(--panel); stroke-width: 1; }
  .mx-cell:hover { stroke: var(--ink); stroke-width: 2; }
  .mx-grid { fill: var(--paper); }
  .mx-cross { fill: var(--cyan-soft); opacity: 0.55; pointer-events: none; }
  .mx-diag { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .mx-sep { stroke: var(--ink); stroke-width: 1.5; }
  .scale { display: inline-flex; height: 12px; width: 140px; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; vertical-align: middle; }
  .scale span { flex: 1; }
  @media (prefers-reduced-motion: reduce) { .edge.flow { animation: none; stroke-dasharray: none; } }

  /* lists and tables */
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { font: 700 13px var(--head); letter-spacing: 0.07em; text-transform: uppercase; text-align: left; border-bottom: 2px solid var(--ink); padding: 6px 8px;
       white-space: nowrap; cursor: default; }
  th[data-sort] { cursor: pointer; }
  th[data-sort]:hover { color: var(--cyan); }
  td { border-bottom: 1px solid var(--line); padding: 5px 8px; vertical-align: top; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .ev { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
  .ev div { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  details > summary { cursor: pointer; font: 700 14px var(--head); letter-spacing: 0.06em; text-transform: uppercase; }
  details[open] > summary { margin-bottom: 8px; }

  .prob { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; border-top: 2px solid var(--line); padding-top: 12px; }
  .prob:first-child { border-top: 0; padding-top: 0; }
  .prob .id { font: 400 30px/1 var(--display); text-align: center; background: var(--ink); color: var(--paper); border-radius: 5px; padding: 6px 0 4px; height: fit-content; }
  .prob h3 { text-transform: none; letter-spacing: 0.01em; font-size: 19px; }
  .pips { display: inline-flex; gap: 2px; vertical-align: middle; }
  .pips span { width: 9px; height: 12px; border: 1.5px solid var(--ink); border-radius: 2px; transform: skewX(-12deg); }
  .pips span.f { background: var(--magenta); border-color: var(--magenta); }

  .meter { position: relative; height: 16px; background: var(--code); border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; min-width: 120px; }
  .meter > span { position: absolute; inset: 0 auto 0 0; background: var(--cyan); }
  .meter.low > span { background: var(--magenta); }
  .meter.mid > span { background: var(--pop); }

  .big { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .big div { border: 2px solid var(--ink); border-radius: 5px; padding: 6px 10px; background: var(--paper); }
  .big b { display: block; font: 400 30px/1 var(--display); letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
  .big span { font: 600 12.5px var(--head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

  .back { align-self: flex-start; }
  footer { font-size: 13px; color: var(--muted); }

  @media (max-width: 900px) {
    .mapgrid { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; max-height: none; }
  }
  @media (max-width: 520px) {
    .prob { grid-template-columns: minmax(0, 1fr); }
    .prob .id { width: 54px; }
    .panel { padding: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="page">
  <header>
    <span class="tag">Krytical Nova II · Architecture</span>
    <h1>Nova Dependency Map</h1>
    <p class="lede" id="lede"></p>
    <div class="score" id="score"></div>
  </header>

  <div class="bar">
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
    <div class="searchwrap">
      <input id="q" type="search" placeholder="Find a class, a system or a file (PlayerInventory, Gameplay/Items, ServerSave.cs)" autocomplete="off" aria-label="Search">
      <div class="results" id="results" hidden></div>
    </div>
  </div>

  <main id="view"></main>
  <footer id="foot"></footer>
</div>

<script>
const D = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = p => p.replace(/^Assets\/_Game\//, "");
const KIND = [[1, "inherits"], [2, "serialized field"], [4, "GetComponent"], [8, "static"], [16, "FindObject"], [32, "uses"]];
const kindChips = k => KIND.filter(([b]) => k & b).map(([, n]) => `<span class="chip ${n === "static" || n === "FindObject" ? "warn" : "soft"}">${n}</span>`).join(" ");
const ROLE = { mono: "MonoBehaviour", net: "NetworkBehaviour", so: "ScriptableObject", plain: "class", enum: "enum", interface: "interface", editor: "editor" };
const EFFORT = { 1: "small fix", 2: "medium fix", 3: "large fix" };
const sysById = Object.fromEntries(D.systems.map(s => [s.id, s]));
const T = D.types, F = D.files, A = D.assets;

// reverse index: who uses each type, and each type's runtime index
const usedBy = T.map(() => []);
T.forEach((t, i) => t.out.forEach(([b, k]) => usedBy[b].push([i, k])));
const typesOfSys = {};
T.forEach((t, i) => { if (t.k === "rt") (typesOfSys[t.sys] = typesOfSys[t.sys] || []).push(i); });

// --- header ---------------------------------------------------------------------------------------------------------
const M = D.meta;
$("#lede").innerHTML = `Every runtime script of the game, what it uses and who uses it, the prefabs, scenes and data assets that hold it, and the tests that touch it. ` +
  `<b>${M.files}</b> scripts (${M.lines.toLocaleString()} lines) are read as text; Editor tools are left out. A system may use the systems below it; ` +
  `a <b style="color:var(--magenta)">pink</b> line is a reference that runs the other way, and each one is a place where changing one system forces a change in another.`;
const scoreSegs = [
  [M.files, "runtime scripts", "", "systems"], [M.types, "classes & types", "", "systems"], [M.so, "ScriptableObject classes", "", "data"],
  [M.uphill, "links running uphill", "bad", "problems"], [M.twoway, "pairs that use each other", "bad", "problems"],

function layout() {
  const levels = {};
  D.systems.forEach(s => (levels[s.level] = levels[s.level] || []).push(s));
  const maxL = Math.max(...D.systems.map(s => s.level));
  const W = 1000, rowH = 74, top = 20, nodeW = 150, nodeH = 44, left = 104, pos = {};
  Object.entries(levels).forEach(([l, list]) => {
    list.sort((a, b) => a.order - b.order);
    const gap = Math.min(40, (W - left - list.length * nodeW) / Math.max(1, list.length - 1));
    const total = list.length * nodeW + (list.length - 1) * gap;
    let x = left + (W - left - total) / 2;
    list.forEach(s => { pos[s.id] = { x, y: top + (maxL - l) * rowH, w: nodeW, h: nodeH }; x += nodeW + gap; });
  });
  return { pos, W, H: top + (maxL + 1) * rowH, maxL, rowH, top };
}
function curve(a, b) {
  const ax = a.x + a.w / 2, bx = b.x + b.w / 2;
  if (a.y < b.y) return `M${ax},${a.y + a.h} C${ax},${a.y + a.h + 40} ${bx},${b.y - 40} ${bx},${b.y}`;
  if (a.y > b.y) return `M${ax + 10},${a.y} C${ax + 70},${a.y - 50} ${bx + 70},${b.y + b.h + 50} ${bx + 10},${b.y + b.h}`;
  const yy = a.y + a.h, mid = (ax + bx) / 2;
  return `M${ax},${yy} Q${mid},${yy + 36} ${bx},${yy}`;
}
function drawMap() {

  // one band per layer, from its highest step to its lowest

    const ls = D.systems.filter(s => s.layer === name).map(s => s.level);

      <text class="band-label" x="12" y="${(y0 + y1) / 2 - 2}" fill="var(--lay${li})">${esc(name)}</text>
      <text class="band-sub" x="12" y="${(y0 + y1) / 2 + 12}">${n} system${n > 1 ? "s" : ""}</text>`;
  });
  D.sysEdges.forEach((e, i) => {

  });

      tip.hidden = false; place(ev); });
    g.addEventListener("mousemove", place);
    g.addEventListener("mouseleave", () => { hoverSys = null; tip.hidden = true; applyState(); });

  });
  wrap.querySelectorAll("[data-edge]").forEach(p => {
    const e = D.sysEdges[+p.dataset.edge];
    p.addEventListener("mouseenter", ev => { tip.innerHTML = `<b>${esc(nice(e.a))} → ${esc(nice(e.b))}</b>${e.files} file${e.files > 1 ? "s" : ""} use ${e.types} type${e.types > 1 ? "s" : ""}<br><span class="muted">click for the exact lines</span>`; tip.hidden = false; place(ev); });
    p.addEventListener("mousemove", place);

  // drag to pan once zoomed in; Ctrl + wheel (or a pinch on a trackpad) zooms around the pointer
  const svg = $("#mapsvg");

  svg.addEventListener("pointermove", e => { if (!drag) return; const k = vb.w / svg.clientWidth; vb.x = drag.vx - (e.clientX - drag.x) * k; vb.y = drag.vy - (e.clientY - drag.y) * k; setVB(); });

    zoomBy(e.deltaY > 0 ? 1.15 : 0.87, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); }, { passive: false });

function setVB() {
  vb.w = Math.min(vb.W, vb.w); vb.h = vb.w * vb.H / vb.W;
  vb.x = Math.max(0, Math.min(vb.W - vb.w, vb.x)); vb.y = Math.max(0, Math.min(vb.H - vb.h, vb.y));
  $("#mapsvg").setAttribute("viewBox", `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);

function zoomBy(f, fx = 0.5, fy = 0.5) {

// breadth-first waves along the links: "up" follows who uses a system (what a change to it reaches), "down" what it uses
function waves(start, dir) {
  const seen = new Map([[start, 0]]), tree = [];
  let frontier = [start], n = 0;
  while (frontier.length) {
    n++;
    const next = [];
    frontier.forEach(s => ((dir === "up" ? inTo[s] : outOf[s]) || []).forEach(i => {
      const e = D.sysEdges[i], o = dir === "up" ? e.a : e.b;
      if (hiddenLayers.has(sysById[o].layer)) return;
      if (!seen.has(o)) { seen.set(o, n); next.push(o); tree.push(i); }
    }));
    frontier = next;
  }
  return { seen, tree };
}
function route2(a, b) {   // shortest chain of "uses" from a to b, or null
  const prev = new Map([[a, null]]), q = [a];
  while (q.length) {
    const s = q.shift();
    if (s === b) break;
    (outOf[s] || []).forEach(i => { const o = D.sysEdges[i].b; if (!prev.has(o)) { prev.set(o, i); q.push(o); } });
  }
  if (!prev.has(b)) return null;
  const chain = [];
  for (let s = b; prev.get(s) != null; s = D.sysEdges[prev.get(s)].a) chain.unshift(prev.get(s));
  return chain;
}
function pickNode(id) {
  if (mapMode === "path") {
    if (!pathA || (pathA && pathB)) { pathA = id; pathB = null; }
    else if (id !== pathA) pathB = id;
  } else mapSel = mapSel === id ? null : id;

}
function applyState() {
  const svg = $("#mapsvg");
  if (!svg) return;
  const nodeEls = svg.querySelectorAll("[data-node]"), edgeEls = svg.querySelectorAll("path.edge[data-i]");
  const nodeCls = {}, edgeCls = {};
  let hint = "";
  if (mapMode === "explore") {
    const f = hoverSys || mapSel;
    if (f) {
      const near = new Set([f]);
      (outOf[f] || []).forEach(i => { edgeCls[i] = "hot out flow"; near.add(D.sysEdges[i].b); });
      (inTo[f] || []).forEach(i => { edgeCls[i] = "hot in flow"; near.add(D.sysEdges[i].a); });
      D.systems.forEach(s => nodeCls[s.id] = near.has(s.id) ? (s.id === mapSel ? "sel" : "") : "dim");
      D.sysEdges.forEach((e, i) => { if (!edgeCls[i]) edgeCls[i] = "cold"; });
    }
    hint = f ? `${nice(f)} uses ${(outOf[f] || []).length} systems (blue, flowing towards them) and is used by ${(inTo[f] || []).length} (amber). Click a line for the exact files and lines.`
             : "Hover a system to see its links; click to pin it. Ctrl + wheel zooms, drag pans once zoomed.";
  } else if (mapMode === "ripple") {
    if (mapSel) {
      const { seen, tree } = waves(mapSel, rippleDir);
      D.systems.forEach(s => { const w = seen.get(s.id); nodeCls[s.id] = w === 0 ? "origin sel" : w ? "w" + Math.min(3, w) : "dim"; });
      D.sysEdges.forEach((e, i) => edgeCls[i] = tree.includes(i) ? "hot ripple flow" : "cold");
      hint = rippleDir === "up" ? `Change ${nice(mapSel)} and these can be affected: the number on each is how many links away it sits.`
                                : `What ${nice(mapSel)} stands on: the number on each is how many links away it sits.`;
    } else hint = "Click a system to see how far a change to it can travel.";
  } else {
    if (pathA) {
      const chain = pathB ? route2(pathA, pathB) || [] : [];
      const on = new Set([pathA, pathB].filter(Boolean));
      chain.forEach(i => { on.add(D.sysEdges[i].a); on.add(D.sysEdges[i].b); edgeCls[i] = "hot path flow"; });
      D.systems.forEach(s => nodeCls[s.id] = on.has(s.id) ? "onpath" + (s.id === pathA || s.id === pathB ? " sel" : "") : "dim");
      D.sysEdges.forEach((e, i) => { if (!edgeCls[i]) edgeCls[i] = "cold"; });
      hint = !pathB ? `From ${nice(pathA)}: now click the system to reach.` : chain.length ? `${chain.length} link${chain.length > 1 ? "s" : ""} from ${nice(pathA)} to ${nice(pathB)}.` : `${nice(pathA)} never reaches ${nice(pathB)}, so a change to ${nice(pathB)} cannot break it.`;
    } else hint = "Click a system, then a second one: the shortest chain of uses from the first to the second.";
  }
  const rippleSeen = mapMode === "ripple" && mapSel ? waves(mapSel, rippleDir).seen : null;
  nodeEls.forEach(g => {
    const id = g.dataset.node, off = hiddenLayers.has(sysById[id].layer);
    g.setAttribute("class", "node " + (off ? "off" : nodeCls[id] || ""));
    const w = rippleSeen ? rippleSeen.get(id) : 0;
    g.classList.toggle("has-badge", !!w);
    g.querySelector(".badge").textContent = w ? String(w) : "";
  });
  edgeEls.forEach(p => {
    const i = +p.dataset.i, e = D.sysEdges[i];
    const off = hiddenLayers.has(sysById[e.a].layer) || hiddenLayers.has(sysById[e.b].layer);
    p.setAttribute("class", "edge" + (e.uphill ? " up" : e.back ? " back" : "") + " " + (off ? "cold" : edgeCls[i] || ""));
  });
  svg.querySelectorAll("[data-edge]").forEach(p => { const e = D.sysEdges[+p.dataset.edge];
    p.classList.toggle("off", hiddenLayers.has(sysById[e.a].layer) || hiddenLayers.has(sysById[e.b].layer)); });
  svg.querySelectorAll("path.edge[data-u]").forEach(p => { const e = D.unseen[+p.dataset.u];
    p.style.display = showUnseen && !hiddenLayers.has(sysById[e.a].layer) && !hiddenLayers.has(sysById[e.b].layer) && mapMode === "explore" ? "" : "none"; });
  $("#maphint").textContent = hint;
}

      <div class="seg-ctl" role="group" aria-label="Direction"><button data-dir="up" aria-pressed="${rippleDir === "up"}">What it affects</button><button data-dir="down" aria-pressed="${rippleDir === "down"}">What it needs</button></div>
      <p>${rippleDir === "up" ? `A change to <b>${esc(nice(mapSel))}</b> can reach <b>${total}</b> of ${D.systems.length - 1} other systems.` : `<b>${esc(nice(mapSel))}</b> stands on <b>${total}</b> other systems.`}</p>
      ${Object.entries(byWave).map(([w, ids]) => `<div class="wave"><span class="n" style="background:var(--w${Math.min(3, +w)})">${w}</span><div class="row">${ids.sort().map(id => `<button class="chip" data-act="sys" data-id="${esc(id)}">${esc(nice(id))}</button>`).join("")}</div></div>`).join("") || '<p class="muted">Nothing: no other system depends on it.</p>'}
      <p class="muted" style="font-size:13px">Wave 1 ${rippleDir === "up" ? "uses it directly" : "is what it uses directly"}; wave 2 goes through wave 1, and so on.</p>${layerKey}`;
    side.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { rippleDir = b.dataset.dir; applyState(); sideInfo(); });
    return bind();
  }
  if (mapMode === "path") {
    const chain = pathA && pathB ? route2(pathA, pathB) : null;
    const back = pathA && pathB ? route2(pathB, pathA) : null;
    side.innerHTML = `<h3>Path</h3>
      ${!pathA ? `<p>Click the system to start from, then the one to reach.</p>` : !pathB ? `<p>From <b>${esc(nice(pathA))}</b>. Now click the system to reach.</p>` :
        chain ? `<p><b>${esc(nice(pathA))}</b> reaches <b>${esc(nice(pathB))}</b> in ${chain.length} link${chain.length > 1 ? "s" : ""}:</p>
          <div class="chain">${chain.map((i, j) => `${j === 0 ? `<span class="chip">${esc(nice(D.sysEdges[i].a))}</span>` : ""}<button class="link" data-act="edge" data-id="${i}">→</button><span class="chip">${esc(nice(D.sysEdges[i].b))}</span>`).join("")}</div>
          <p class="muted" style="font-size:13px">Each arrow opens the files and lines behind that link.</p>` :
        `<p><b>${esc(nice(pathA))}</b> never reaches <b>${esc(nice(pathB))}</b>${back ? `, but ${esc(nice(pathB))} reaches ${esc(nice(pathA))} in ${back.length} link${back.length > 1 ? "s" : ""}` : ""}. A change to ${esc(nice(pathB))} cannot break ${esc(nice(pathA))}.</p>`}
      ${pathA ? `<button class="chip" id="pathReset">Start again</button>` : ""}${layerKey}`;
    const r = $("#pathReset"); if (r) r.onclick = () => { pathA = pathB = null; applyState(); sideInfo(); };
    return bind();
  }
  if (!mapSel) {
    const clean = !D.meta.uphill && !D.meta.twoway && !D.meta.back;
    const cuts = D.sysEdges.map((e, i) => [e, i]).filter(([e]) => e.back || e.uphill);
    side.innerHTML = `<h3>${clean ? "A clean stack" : "Links to cut"}</h3>
      <div class="health"><div class="${D.meta.uphill ? "" : "ok"}"><b>${D.meta.uphill}</b><span>links uphill</span></div><div class="${D.meta.twoway ? "" : "ok"}"><b>${D.meta.twoway}</b><span>two-way pairs</span></div>
        <div class="${D.meta.refused ? "" : "ok"}"><b>${D.meta.refused}</b><span>links the compiler would refuse</span></div><div><b>${D.sysEdges.length}</b><span>links between systems</span></div></div>
      <p class="muted" style="font-size:13px">${clean ? "Every link points down or stays in its layer, and each system is its own assembly, so the compiler refuses a loop." : `Remove these ${cuts.length} links and every reference points down.`}
        The map was checked against the ${D.meta.declared} references the assemblies declare: ${D.meta.refused ? `${D.meta.refused} links it found are not allowed by them, so it misread something.` : "every link it found is one the compiler allows."}
        ${D.unseen.length ? `${D.unseen.length} declared references name no type in code (dotted on the map).` : ""}</p>
      ${cuts.length ? `<div class="ev">${cuts.map(([e, i]) => linkLine(i, e.a + " → " + e.b)).join("")}</div>` : ""}
      ${layerKey}`;
    return bind();
  }
  const s = sysById[mapSel];
  const outs = (outOf[mapSel] || []).slice().sort((x, y) => D.sysEdges[y].files - D.sysEdges[x].files);
  const ins = (inTo[mapSel] || []).slice().sort((x, y) => D.sysEdges[y].files - D.sysEdges[x].files);
  side.innerHTML = `<div class="row" style="justify-content:space-between"><h3>${esc(s.id)}</h3><button class="chip" data-act="sys" data-id="${esc(s.id)}">Open page</button></div>
    <p class="muted">${esc(s.layer)} · ${s.files} files · ${s.lines.toLocaleString()} lines · ${esc(s.asm.join(", "))}</p>
    <div class="row"><button class="chip" id="toRipple">What a change to it reaches</button></div>
    <h4>Uses (${outs.length})</h4><div class="ev">${outs.map(i => linkLine(i, D.sysEdges[i].b)).join("") || '<span class="muted">nothing outside itself</span>'}</div>
    <h4>Used by (${ins.length})</h4><div class="ev">${ins.map(i => linkLine(i, D.sysEdges[i].a)).join("") || '<span class="muted">nothing</span>'}</div>${layerKey}`;
  $("#toRipple").onclick = () => { mapMode = "ripple"; rippleDir = "up"; document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === "ripple")); applyState(); sideInfo(); };
  bind();
}

// --- Matrix ---------------------------------------------------------------------------------------------------------
function viewMatrix(v) {
  const order = [...D.systems].sort((a, b) => b.rank - a.rank || b.level - a.level || a.order - b.order).map(s => s.id);
  const n = order.length, C = 24, L = 176, Hd = 150, idx = Object.fromEntries(order.map((id, i) => [id, i]));
  const maxF = Math.max(...D.sysEdges.map(e => e.files));
  const W = L + n * C + 8, H = Hd + n * C + 8;
  let below = 0, cells = "", labels = "", seps = "";
  D.sysEdges.forEach((e, i) => {
    const r = idx[e.a], c = idx[e.b];
    if (r == null || c == null) return;
    if (c < r) below++;
    const t = Math.sqrt(e.files / maxF), bad = e.uphill || e.back;
    cells += `<rect class="mx-cell" x="${L + c * C + 1}" y="${Hd + r * C + 1}" width="${C - 2}" height="${C - 2}" rx="3" data-edge="${i}"
      fill="${bad ? "var(--magenta)" : "var(--cyan)"}" fill-opacity="${(0.18 + 0.82 * t).toFixed(2)}"><title>${esc(e.a)} uses ${esc(e.b)}: ${e.files} file(s), ${e.types} type(s)</title></rect>`;
  });
  D.unseen.forEach(e => { const r = idx[e.a], c = idx[e.b]; if (r == null || c == null) return;
    cells += `<rect x="${L + c * C + 4}" y="${Hd + r * C + 4}" width="${C - 8}" height="${C - 8}" rx="2" fill="none" stroke="var(--muted)" stroke-dasharray="2 2"><title>${esc(e.a)} declares ${esc(e.b)} but names no type of it</title></rect>`; });
  order.forEach((id, i) => {
    const li = layerIdx(sysById[id].layer);
    labels += `<rect x="${L - 8}" y="${Hd + i * C + 4}" width="5" height="${C - 8}" rx="2" fill="var(--lay${li})"></rect>
      <text class="mx-label" data-row="${i}" x="${L - 14}" y="${Hd + i * C + C / 2 + 4}" text-anchor="end" data-act="sys" data-id="${esc(id)}">${esc(nice(id))}</text>
      <text class="mx-label" data-col="${i}" transform="translate(${L + i * C + C / 2 + 4},${Hd - 10}) rotate(-60)" data-act="sys" data-id="${esc(id)}">${esc(nice(id))}</text>`;
    if (i > 0 && sysById[order[i - 1]].layer !== sysById[id].layer)
      seps += `<line class="mx-sep" x1="${L - 10}" y1="${Hd + i * C}" x2="${L + n * C}" y2="${Hd + i * C}"></line><line class="mx-sep" x1="${L + i * C}" y1="${Hd - 4}" x2="${L + i * C}" y2="${Hd + n * C}"></line>`;
  });
  v.innerHTML = `<section class="panel stack">
    <div class="prose"><h2>Who uses whom</h2>
      <p>Each row is a system, each column a system it may use; a filled square means the row uses the column, darker for more files. Rows and columns run in the same order, top layer first, so in a clean stack every square sits <b>above the diagonal</b>. ${below ? `<b style="color:var(--magenta)">${below}</b> square${below > 1 ? "s sit" : " sits"} below it: a link running up the stack.` : "None sits below it today."}</p></div>
    <div class="legend"><span>fewer files <span class="scale">${[0.2, 0.4, 0.6, 0.8, 1].map(o => `<span style="background:var(--cyan);opacity:${o}"></span>`).join("")}</span> more</span>
      <span><svg width="18" height="18" aria-hidden="true"><rect x="2" y="2" width="14" height="14" rx="2" fill="none" stroke="var(--muted)" stroke-dasharray="2 2"></rect></svg> declared, no type named</span>
      <span>Hover for the count, click a square for the files and lines.</span></div>
    <div class="matwrap"><svg id="matsvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Matrix of which system uses which">
      <rect class="mx-grid" x="${L}" y="${Hd}" width="${n * C}" height="${n * C}"></rect>
      <rect class="mx-cross" id="mxRow" x="${L}" y="0" width="${n * C}" height="${C}" visibility="hidden"></rect>
      <rect class="mx-cross" id="mxCol" x="0" y="${Hd}" width="${C}" height="${n * C}" visibility="hidden"></rect>
      <line class="mx-diag" x1="${L}" y1="${Hd}" x2="${L + n * C}" y2="${Hd + n * C}"></line>${seps}${cells}${labels}</svg></div>
  </section>`;
  const svg = $("#matsvg"), rowR = $("#mxRow"), colR = $("#mxCol");
  svg.querySelectorAll(".mx-cell").forEach(r => {
    const e = D.sysEdges[+r.dataset.edge], ri = idx[e.a], ci = idx[e.b];
    r.addEventListener("mouseenter", () => {
      rowR.setAttribute("y", Hd + ri * C); colR.setAttribute("x", L + ci * C); rowR.setAttribute("visibility", "visible"); colR.setAttribute("visibility", "visible");
      svg.querySelector(`[data-row="${ri}"]`).classList.add("hl"); svg.querySelector(`[data-col="${ci}"]`).classList.add("hl"); });
    r.addEventListener("mouseleave", () => { rowR.setAttribute("visibility", "hidden"); colR.setAttribute("visibility", "hidden"); svg.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")); });
    r.addEventListener("click", () => show("edge", r.dataset.edge));
  });
}

      <h2>${esc(t.n)}</h2>
      <p class="muted"><code>${esc(t.ns ? t.ns + "." + t.n : t.n)}</code> in ${sysLink(t.sys)}${t.nested ? ` · holds ${t.nested.map(esc).join(", ")}` : ""}</p>
      ${t.rip ? `<div class="big"><div><b>${t.rip[0]}</b><span>files use it directly</span></div><div><b>${t.rip[1]}</b><span>systems they sit in</span></div>
        <div><b>${t.rip[2]}</b><span>types reach it through others</span></div><div><b>${t.lines}</b><span>lines</span></div>
        <div><b>${t.held ? (t.held.prefab || 0) + (t.held.scene || 0) : 0}</b><span>prefabs / scenes hold or wire it</span></div>
        ${t.soAssets ? `<div><b>${t.soAssets}</b><span>data assets of this class</span></div>` : ""}</div>` : ""}
      <p>${t.rip ? `Change its public shape and up to <b>${t.rip[0]}</b> files may need to follow. ` : ""}${kindsIn & 2 ? "It is wired in the Inspector (serialized fields point at it), so renaming or moving its fields loses those links unless they keep <code>[FormerlySerializedAs]</code>. " : ""}${t.held ? "Prefabs or scenes hold it by its script's .meta GUID: move the file together with its .meta and they keep working. " : ""}${t.managed ? `<b>${t.managed[0]}</b> entries in ${t.managed[1]} asset(s) store it by name and assembly (<code>${esc(t.managed[2])}</code>): renaming it or moving it to another assembly needs <code>[MovedFrom]</code>. ` : ""}</p>
      <div class="ev">${t.f.map(fi => fileRef(fi, 0, F[fi].l + " lines")).join("")}</div>
    </section>
    <div class="grid2">
      <section class="panel stack"><h3>It uses</h3>${list(uses) || '<span class="muted">No first-party types.</span>'}</section>
      <section class="panel stack"><h3>Used by</h3>${list(users) || '<span class="muted">Nothing in the runtime uses it by name.</span>'}</section>
    </div>
    ${statics.length || hubs.length ? `<section class="panel stack"><h3>Global state and events</h3><div class="ev">${statics.map(([m, k]) => `<div><code>${esc(t.n)}.${esc(m)}</code><span class="chip ${k === "event" ? "warn" : "bad"}">${k === "state" ? "static state" : "static event"}</span></div>`).join("")}
      ${hubs.map(h => `<div><code>${esc(t.n)}.${esc(h.m)}</code><span class="chip warn">${esc(h.k)}</span><span class="muted">${h.f.length} files in ${h.s.length} other systems</span></div>`).join("")}</div></section>` : ""}
    ${t.soAssets ? `<section class="panel stack"><h3>Its data assets (${t.soAssets})</h3><p class="muted">Wired from ${Object.entries(t.dataRefCount || {}).map(([k, n]) => `${n} ${k}${n > 1 ? "s" : ""}`).join(", ") || "nothing (loaded another way)"}.</p>
      <details><summary>Some of the assets</summary><div class="ev">${assetList(t.soSample || [])}</div></details>
      ${Object.entries(t.dataRefs || {}).map(([k, ids]) => `<details><summary>${esc(k)}s that point at them</summary><div class="ev">${assetList(ids)}</div></details>`).join("")}</section>` : ""}
    ${t.heldList?.length || t.heldAssets?.length ? `<section class="panel stack"><h3>Held by</h3><div class="ev">${assetList(t.heldList || [])}${assetList(t.heldAssets || [])}</div></section>` : ""}
    ${t.tests?.length ? `<section class="panel stack"><h3>Tests that touch it</h3><div class="ev">${t.tests.map(fi => fileRef(fi)).join("")}</div></section>` : ""}
  </div>`;
}

// --- Hubs -----------------------------------------------------------------------------------------------------------
function viewHubs(v) {
  v.innerHTML = `<div class="stack">
    <section class="panel stack"><div class="prose"><h2>Hubs</h2>
      <p>Static members reached from other systems: singletons (<code>.Instance</code>), locators (<code>.Local</code>, <code>.Current</code>, <code>.Active</code>), static events and static lists.
      Every caller is tied to the one class and to the moment it gets set, and none of them can be tested without it. Marked ones are the risky kind; the rest are constants and pure helpers, which are fine.</p></div>
      <div class="tablewrap"><table id="hubtab"><thead><tr><th data-sort>Member</th><th data-sort>Kind</th><th data-sort>Lives in</th><th data-sort class="n">Runtime files</th><th>Other systems</th></tr></thead>
      <tbody>${D.hubs.map(h => `<tr><td>${typeLink(h.t)}<code>.${esc(h.m)}</code></td><td><span class="chip ${h.risk ? "warn" : "soft"}">${esc(h.k)}</span></td><td>${esc(T[h.t].sys)}</td>
        <td class="n">${h.f.length}</td><td>${h.s.map(s => esc(s.replace("Gameplay/", ""))).join(", ")}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="panel stack"><div class="prose"><h3>Static state and events, class by class</h3>
      <p>Static fields that change at run time and static events. Each is global state that survives scene loads (and, with domain reload off, Play sessions), so a refactor has to find them all.</p></div>
      <div class="ev">${D.state.map(g => `<div>${typeLink(g.t)}<span class="muted">${esc(T[g.t].sys)}</span>${g.state.map(s => `<span class="chip bad">${esc(s)}</span>`).join("")}${g.events.map(s => `<span class="chip warn">${esc(s)}</span>`).join("")}</div>`).join("")}</div></section>
  </div>`;
  sortable($("#hubtab"));
}

// --- Design data ----------------------------------------------------------------------------------------------------
function viewData(v) {
  const so = T.map((t, i) => [t, i]).filter(([t]) => t.k === "rt" && t.role === "so").sort((a, b) => (b[0].soAssets || 0) - (a[0].soAssets || 0));
  const S = D.smells;
  const lines = arr => arr.map(([fi, n, s]) => `<div><span class="path">${esc(short(F[fi].p))}:${n}</span><code>${esc(s)}</code></div>`).join("");
  v.innerHTML = `<div class="stack">
    <section class="panel stack"><div class="prose"><h2>Design data</h2>
      <p>The game is meant to be tuned in the Editor through ScriptableObjects. This view shows how true that is: each ScriptableObject class, how many assets of it exist, how much runtime code reads it, and how the assets are wired in.
      Below it, the places where tuning still lives in code instead.</p></div>
      <div class="tablewrap"><table id="sotab"><thead><tr><th data-sort>Class</th><th data-sort>System</th><th data-sort class="n">Assets</th><th data-sort class="n">Runtime files reading it</th>
        <th data-sort class="n">Wired from prefabs</th><th data-sort class="n">from scenes</th><th data-sort class="n">from other assets</th></tr></thead>
      <tbody>${so.map(([t, i]) => `<tr><td>${typeLink(i)}</td><td>${esc(t.sys)}</td><td class="n">${t.soAssets || 0}</td><td class="n">${t.rip[0]}</td>
        <td class="n">${t.dataRefCount?.prefab || 0}</td><td class="n">${t.dataRefCount?.scene || 0}</td><td class="n">${t.dataRefCount?.asset || 0}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="panel stack"><h3>Gameplay numbers fixed in code (${S.hardcoded.reduce((n, h) => n + h.items.length, 0)})</h3>
      <p class="prose muted">Named constants in Gameplay runtime code. Ids, masks, sizes, <code>Default*</code> seeds for settings fields and 0/1 are left out. Some are engineering limits that belong in code; the rest a designer cannot change without a programmer.</p>
      ${S.hardcoded.map(h => `<details><summary>${esc(short(F[h.f].p))} <span class="num">(${h.items.length})</span></summary><div class="ev">${h.items.map(([n, k, val]) => `<div><span class="path">line ${n}</span><code>${esc(k)} = ${esc(val)}</code></div>`).join("")}</div></details>`).join("")}</section>
    <section class="panel stack"><h3>Settings fallbacks (${S.fallbacks.length})</h3><p class="prose muted">When the settings asset is missing the game silently runs on a second copy of the number kept in code. A wiring mistake hides, and the two copies drift.</p>
      <details><summary>All of them</summary><div class="ev">${lines(S.fallbacks)}</div></details></section>
    <section class="panel stack"><h3>Runtime writes to shared assets (${S.soWrites.length})</h3><p class="prose muted">A write to a ScriptableObject or to the render pipeline asset during Play changes the asset itself in the Editor. Fine when it is put back on exit (the graphics settings do that); a leak when it is not.</p>
      <details><summary>All of them</summary><div class="ev">${lines(S.soWrites)}</div></details></section>
    <section class="panel stack"><h3>Lookups by name (${S.strings.length})</h3><p class="prose muted">The compiler cannot see these; renaming or moving the target breaks them only at run time.</p><div class="ev">${lines(S.strings)}</div></section>
    <section class="panel stack"><h3>Static accessors that search on every call (${S.localGetComponent.length})</h3><div class="ev">${lines(S.localGetComponent)}</div></section>
    <section class="panel stack"><h3>FindObject calls in runtime code (${S.finds.length})</h3><details><summary>All of them</summary><div class="ev">${lines(S.finds)}</div></details></section>
  </div>`;
  sortable($("#sotab"));
}

// --- Tests ----------------------------------------------------------------------------------------------------------
function viewTests(v) {
  const rows = [...D.systems].sort((a, b) => (a.testable ? a.tested / a.testable : 0) - (b.testable ? b.tested / b.testable : 0));
  const untested = T.map((t, i) => [t, i]).filter(([t]) => t.k === "rt" && t.role !== "enum" && !t.tests.length).sort((a, b) => b[0].rip[0] - a[0].rip[0]).slice(0, 40);
  v.innerHTML = `<div class="stack">
    <section class="panel stack"><div class="prose"><h2>Tests</h2>
      <p>A class counts as touched when a test file names it. That says a test exists nearby, not that every path is covered. ${M.testFiles} test scripts in ${new Set(F.filter(f => f.k === "test").map(f => f.a)).size} test assemblies, all EditMode.
      Before a refactor moves a class, it should be touched by a test, so the move can be checked without opening the game.</p></div>
      <div class="tablewrap"><table><thead><tr><th>System</th><th>Classes touched by a test</th><th class="n">Test files</th></tr></thead>
      <tbody>${rows.map(s => `<tr><td>${sysLink(s.id)}</td><td><div class="row" style="flex-wrap:nowrap">${meter(s.testable ? s.tested / s.testable : 0)}<span class="num muted">${s.tested} of ${s.testable}</span></div></td><td class="n">${s.testFiles}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="panel stack"><h3>Most-used classes no test touches</h3>
      <div class="tablewrap"><table><thead><tr><th>Class</th><th>System</th><th class="n">Files using it</th><th class="n">Reached through others</th></tr></thead>
      <tbody>${untested.map(([t, i]) => `<tr><td>${typeLink(i)}</td><td>${esc(t.sys)}</td><td class="n">${t.rip[0]}</td><td class="n">${t.rip[2]}</td></tr>`).join("")}</tbody></table></div></section>
  </div>`;
}

// --- How to read ----------------------------------------------------------------------------------------------------
function viewRead(v) {
  v.innerHTML = `<section class="panel stack"><div class="prose">
    <h2>How to read the map</h2>
    <h3>Layers</h3>
    <p>${D.meta.ranks.map(r => `<b>${esc(r.name)}</b>: ${r.members.map(esc).join(", ")}`).join(". ")}. A system may use its own layer and the ones below.
      This follows the rules in <code>_Docs/ProjectOrganization.md</code> section 4: Core knows nothing of gameplay, gameplay never knows its presentation, presentation observes gameplay.</p>
    <h3>Steps</h3>
    <p>Inside a layer the systems are ordered so that as few links as possible point backwards. The map draws them as steps, step 0 at the bottom. A grey line goes down a step: fine.
      A pink line goes up: either it runs <b>uphill</b> into a higher layer (dashed), or it closes a <b>loop</b> between systems of the same layer (solid). Since 19 Oct 2026 every
      system is its own assembly, so the compiler refuses a loop; the map should show none.</p>
    <h3>Explore, Ripple and Path</h3>
    <p><b>Explore</b>: hover a system for what it uses (blue, flowing towards it) and what uses it (amber); click to pin it. <b>Ripple</b>: click a system for everything a change to it can reach,
      wave by wave (wave 1 uses it directly, wave 2 uses wave 1...), or switch to what it needs. <b>Path</b>: click two systems for the shortest chain of uses from the first to the second;
      when there is none, a change to the second cannot break the first. The <b>Matrix</b> shows the same links as a grid, where a clean stack keeps every square above the diagonal.</p>
    <h3>Ripple</h3>
    <p>For each class: the files that use it directly, the systems they sit in, and the types that reach it through others. A class with a large ripple is expensive to change and needs tests before it moves.</p>
    <h3>The tangle</h3>
    <p><b>${M.tangle}</b> classes all reach each other through some chain of uses: ${Object.entries(M.tangleSys).map(([s, n]) => `${esc(s.replace("Gameplay/", ""))} ${n}`).join(", ")}.
      Inside a tangle a change can in principle travel to every member, so its classes show about the same number of types reaching them through others.
      With one assembly per system a tangle can only live inside one system. A class page marks its members "in the tangle".</p>
    <h3>How a link is found</h3>
    <p>The script reads every runtime and test <code>.cs</code> file as text, strips comments and strings, and resolves every name against the classes the project declares, through each file's namespace and <code>using</code> lines.
      It marks how a class is used: inherits, serialized field (designer wiring), GetComponent, static access, FindObject, or plain use. Assets are read as Unity text YAML: <code>m_Script</code> GUIDs say which script a prefab, scene or data asset holds;
      other GUIDs say which data assets they point at; <code>[SerializeReference]</code> entries name a class and assembly as text.</p>
    <h3>What it cannot see</h3>
    <p>It is not the compiler. It misses links made through reflection or strings (listed under Design data), UnityEvents wired in the Inspector, links in Editor code (left out on purpose), references that only go through an interface or a base class,
      and a type reached through another assembly's member without its name being written (the compiler still needs that assembly referenced: error CS0012).
      A simple name that two namespaces both declare is skipped rather than guessed. Every link it does show names the file and line, so it can be checked.</p>
    <h3>Checked against the compiler</h3>
    <p>Each assembly declares the assemblies it may use; there are ${D.meta.declared} such references between systems. A link the map found that none of them allows would not compile, so it would mean the map misread a name:
      ${D.meta.refused ? `<b style="color:var(--magenta)">${D.meta.refused}</b> today (${D.refused.map(e => esc(e.a) + " → " + esc(e.b)).join(", ")}).` : "there are none today."}
      ${D.unseen.length ? `${D.unseen.length} declared references name no type in code (${D.unseen.map(e => esc(nice(e.a)) + " → " + esc(nice(e.b))).join(", ")}): each is either unused or one of the CS0012 kind. They show as dotted lines on the map and dotted squares in the matrix.` : "Every declared reference is used in code."}</p>
    <h3>Re-run it</h3>
    <p>From the project folder: <code>python "Assets/_Game/Tools/Editor/Architecture/Scripts~/dependency_map.py"</code> (a few seconds, Unity can stay closed).
      <code>--baseline</code> saves today's uphill links and two-way pairs; <code>--check</code> fails when a new one appears, so a refactor cannot quietly add one back.
      The written report is <code>_Docs/Reference/Dependency-Map.md</code> and the plan to fix it is <code>_Docs/Plans/architecture-decoupling-plan.md</code>.</p>
  </div></section>`;
}

// --- search ---------------------------------------------------------------------------------------------------------
const q = $("#q"), results = $("#results");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  if (s.length < 2) { results.hidden = true; return; }
  const hits = [];
  D.systems.forEach(x => { if (x.id.toLowerCase().includes(s)) hits.push([0, "system", x.id, () => show("sys", x.id)]); });
  T.forEach((t, i) => { if (t.k === "rt" && t.n.toLowerCase().includes(s)) hits.push([t.n.toLowerCase() === s ? -1 : t.n.toLowerCase().startsWith(s) ? 1 : 2, ROLE[t.role] === "class" ? "class" : t.role === "so" ? "data" : t.role, t.n + "  ·  " + t.sys, () => show("type", i)]); });
  F.forEach((f, fi) => { if (f.k === "rt" && f.p.toLowerCase().includes(s)) { const t = T.findIndex(t => t.f.includes(fi)); if (t >= 0) hits.push([3, "file", short(f.p), () => show("type", t)]); } });
  hits.sort((a, b) => a[0] - b[0]);
  const top = hits.slice(0, 14);
  results.innerHTML = top.length ? top.map((h, j) => `<button data-hit="${j}"><span class="kind">${esc(h[1])}</span><span>${esc(h[2])}</span></button>`).join("") : `<div style="padding:8px 12px" class="muted">Nothing matches "${esc(q.value)}".</div>`;
  results.hidden = false;
  results.querySelectorAll("[data-hit]").forEach(b => b.onclick = () => { results.hidden = true; q.value = ""; top[+b.dataset.hit][3](); });
});
q.addEventListener("keydown", e => { if (e.key === "Enter") { const b = results.querySelector("[data-hit]"); if (b) b.click(); } if (e.key === "Escape") results.hidden = true; });
document.addEventListener("click", e => { if (!e.target.closest(".searchwrap")) results.hidden = true; });

route();
</script>
