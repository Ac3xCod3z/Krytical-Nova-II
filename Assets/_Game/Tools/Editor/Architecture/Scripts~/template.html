<meta charset="utf-8">
<title>Nova Dependency Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: the same comic book as the Encyclopedia of Nova. A score strip of the headline numbers, a sticky bar with
     search and the six views, and a reader that opens any system or class as its own page. The map stacks the systems
     in layers, users on top, foundations at the bottom, so a line that climbs is a reference running the wrong way. */
  :root {
    --paper: #f6efd9;
    --panel: #fffaf0;
    --ink: #14161c;
    --muted: #5b5a52;
    --line: #b9b19a;
    --dots: rgba(20, 22, 28, 0.10);
    --pop: #ffc928;
    --pop-ink: #14161c;
    --cyan: #138fa0;
    --cyan-soft: #bfe9ee;
    --magenta: #d42a5f;
    --magenta-soft: #ffd3df;
    --ok: #2f8f4e;
    --code: #ece3c6;
    --shadow: #14161c;
    --display: "Bangers", "Impact", sans-serif;
    --head: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141a2b; --panel: #1d2540; --ink: #f4eeda; --muted: #a9adc2; --line: #46507a; --dots: rgba(244, 238, 218, 0.07);
      --pop: #ffc928; --pop-ink: #14161c; --cyan: #3fd2e2; --cyan-soft: #17465a; --magenta: #ff5c8f; --magenta-soft: #4f1d33;
      --ok: #5fd08a; --code: #2a3357; --shadow: #05070d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #141a2b; --panel: #1d2540; --ink: #f4eeda; --muted: #a9adc2; --line: #46507a; --dots: rgba(244, 238, 218, 0.07);
    --pop: #ffc928; --pop-ink: #14161c; --cyan: #3fd2e2; --cyan-soft: #17465a; --magenta: #ff5c8f; --magenta-soft: #4f1d33;
    --ok: #5fd08a; --code: #2a3357; --shadow: #05070d;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--paper); background-image: radial-gradient(var(--dots) 1.5px, transparent 1.6px); background-size: 14px 14px;
         color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
  p, ul, ol, h1, h2, h3, h4 { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
          padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 70px; display: flex; flex-direction: column; gap: 18px; }
  code, .path { font-family: var(--mono); font-size: 0.84em; background: var(--code); border-radius: 3px; padding: 0 4px; overflow-wrap: anywhere; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--magenta); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .tag { font-family: var(--head); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
         background: var(--ink); color: var(--paper); padding: 2px 10px; transform: skewX(-8deg); }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 7vw, 62px); line-height: 0.95; letter-spacing: 0.03em;
       color: var(--pop); -webkit-text-stroke: 2px var(--shadow); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--shadow); text-wrap: balance; }
  .lede { margin-top: 4px; max-width: 74ch; }

  .score { align-self: stretch; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 8px; border: 3px solid var(--ink);
           border-radius: 6px; box-shadow: 5px 5px 0 var(--shadow); overflow: hidden; background: var(--ink); gap: 3px; }
  .seg { display: flex; flex-direction: column; gap: 2px; padding: 7px 12px 8px; background: var(--panel); color: var(--ink); text-decoration: none; min-width: 0; }
  .seg b { font: 400 32px/1 var(--display); letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
  .seg span { font: 700 13px var(--head); letter-spacing: 0.08em; text-transform: uppercase; }
  .seg.bad { background: var(--magenta-soft); }
  .seg.warn { background: var(--pop); color: var(--pop-ink); }
  a.seg:hover { filter: brightness(1.05); }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 8px; background: var(--paper);
         background-image: radial-gradient(var(--dots) 1.5px, transparent 1.6px); background-size: 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab { font: 700 15px var(--head); letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; color: var(--ink); background: var(--panel);
         border: 2px solid var(--ink); border-radius: 5px; padding: 4px 11px; cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); }
  .tab:hover { background: var(--cyan-soft); }
  .tab[aria-current="page"] { background: var(--pop); color: var(--pop-ink); }
  .searchwrap { position: relative; }
  .searchwrap input { width: 100%; font: 500 16px var(--body); padding: 9px 14px; color: var(--ink); background: var(--panel);
                      border: 3px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--shadow); }
  .results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--panel); border: 3px solid var(--ink); border-radius: 6px;
             box-shadow: 5px 5px 0 var(--shadow); max-height: 60vh; overflow: auto; z-index: 30; }
  .results button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
                    padding: 7px 12px; cursor: pointer; }
  .results button:hover, .results button:focus-visible { background: var(--cyan-soft); }
  .results .kind { font: 700 12px var(--head); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); min-width: 52px; }

  .panel { background: var(--panel); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 5px 5px 0 var(--shadow); padding: 16px 18px; min-width: 0; }
  h2 { font: 400 30px/1 var(--display); letter-spacing: 0.04em; text-wrap: balance; }
  h3 { font: 700 18px var(--head); letter-spacing: 0.05em; text-transform: uppercase; }
  h4 { font: 700 15px var(--head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .prose { max-width: 76ch; display: flex; flex-direction: column; gap: 8px; }

  .chip { display: inline-flex; align-items: center; gap: 4px; font: 600 12.5px var(--head); letter-spacing: 0.05em; text-transform: uppercase;
          border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 6px; background: var(--panel); white-space: nowrap; }
  button.chip { cursor: pointer; }
  button.chip:hover { background: var(--cyan-soft); }
  .chip.on { background: var(--ink); color: var(--paper); }
  .chip.bad { background: var(--magenta); color: #fff; border-color: var(--magenta); }
  .chip.warn { background: var(--pop); color: var(--pop-ink); }
  .chip.good { background: var(--ok); color: #fff; border-color: var(--ok); }
  .chip.soft { border-color: var(--line); color: var(--muted); }
  .link { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-color: var(--cyan);
          text-decoration-thickness: 2px; text-underline-offset: 2px; text-align: left; }
  .link:hover { color: var(--cyan); }

  /* the map */
  .mapgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .mapwrap { overflow-x: auto; padding: 8px; }
  .mapwrap svg { display: block; min-width: 860px; width: 100%; height: auto; }
  .lvl-label { font: 600 11px var(--head); letter-spacing: 0.1em; text-transform: uppercase; fill: var(--muted); }
  .band { fill: var(--dots); }
  .node rect.box { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
  .node rect.size { fill: var(--cyan-soft); }
  .node text { font: 700 13px var(--head); letter-spacing: 0.02em; fill: var(--ink); pointer-events: none; }
  .node text.sub { font: 500 10.5px var(--mono); fill: var(--muted); }
  .node { cursor: pointer; }
  .node:hover rect.box, .node.sel rect.box { stroke: var(--magenta); stroke-width: 3; }
  .node.dim { opacity: 0.35; }
  .edge { fill: none; stroke: var(--line); }
  .edge.back { stroke: var(--magenta); }
  .edge.up { stroke: var(--magenta); stroke-dasharray: 6 4; }
  .edge.outsel { stroke: var(--cyan); }
  .edge.insel { stroke: #c98f00; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; }
  .legend i { display: inline-block; width: 26px; height: 0; border-top: 3px solid var(--line); vertical-align: middle; margin-right: 6px; }
  .legend i.back { border-color: var(--magenta); }
  .legend i.up { border-top: 3px dashed var(--magenta); }
  .legend i.out { border-color: var(--cyan); }
  .legend i.in { border-color: #c98f00; }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); max-height: calc(100vh - 130px); overflow: auto; }

  /* lists and tables */
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { font: 700 13px var(--head); letter-spacing: 0.07em; text-transform: uppercase; text-align: left; border-bottom: 2px solid var(--ink); padding: 6px 8px;
       white-space: nowrap; cursor: default; }
  th[data-sort] { cursor: pointer; }
  th[data-sort]:hover { color: var(--cyan); }
  td { border-bottom: 1px solid var(--line); padding: 5px 8px; vertical-align: top; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .ev { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
  .ev div { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  details > summary { cursor: pointer; font: 700 14px var(--head); letter-spacing: 0.06em; text-transform: uppercase; }
  details[open] > summary { margin-bottom: 8px; }

  .prob { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; border-top: 2px solid var(--line); padding-top: 12px; }
  .prob:first-child { border-top: 0; padding-top: 0; }
  .prob .id { font: 400 30px/1 var(--display); text-align: center; background: var(--ink); color: var(--paper); border-radius: 5px; padding: 6px 0 4px; height: fit-content; }
  .prob h3 { text-transform: none; letter-spacing: 0.01em; font-size: 19px; }
  .pips { display: inline-flex; gap: 2px; vertical-align: middle; }
  .pips span { width: 9px; height: 12px; border: 1.5px solid var(--ink); border-radius: 2px; transform: skewX(-12deg); }
  .pips span.f { background: var(--magenta); border-color: var(--magenta); }

  .meter { position: relative; height: 16px; background: var(--code); border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; min-width: 120px; }
  .meter > span { position: absolute; inset: 0 auto 0 0; background: var(--cyan); }
  .meter.low > span { background: var(--magenta); }
  .meter.mid > span { background: var(--pop); }

  .big { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .big div { border: 2px solid var(--ink); border-radius: 5px; padding: 6px 10px; background: var(--paper); }
  .big b { display: block; font: 400 30px/1 var(--display); letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
  .big span { font: 600 12.5px var(--head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

  .back { align-self: flex-start; }
  footer { font-size: 13px; color: var(--muted); }

  @media (max-width: 900px) {
    .mapgrid { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; max-height: none; }
  }
  @media (max-width: 520px) {
    .prob { grid-template-columns: minmax(0, 1fr); }
    .prob .id { width: 54px; }
    .panel { padding: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="page">
  <header>
    <span class="tag">Krytical Nova II · Architecture</span>
    <h1>Nova Dependency Map</h1>
    <p class="lede" id="lede"></p>
    <div class="score" id="score"></div>
  </header>

  <div class="bar">
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
    <div class="searchwrap">
      <input id="q" type="search" placeholder="Find a class, a system or a file (PlayerInventory, Gameplay/Items, ServerSave.cs)" autocomplete="off" aria-label="Search">
      <div class="results" id="results" hidden></div>
    </div>
  </div>

  <main id="view"></main>
  <footer id="foot"></footer>
</div>

<script>
const D = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = p => p.replace(/^Assets\/_Game\//, "");
const KIND = [[1, "inherits"], [2, "serialized field"], [4, "GetComponent"], [8, "static"], [16, "FindObject"], [32, "uses"]];
const kindChips = k => KIND.filter(([b]) => k & b).map(([, n]) => `<span class="chip ${n === "static" || n === "FindObject" ? "warn" : "soft"}">${n}</span>`).join(" ");
const ROLE = { mono: "MonoBehaviour", net: "NetworkBehaviour", so: "ScriptableObject", plain: "class", enum: "enum", interface: "interface", editor: "editor" };
const EFFORT = { 1: "small fix", 2: "medium fix", 3: "large fix" };
const sysById = Object.fromEntries(D.systems.map(s => [s.id, s]));
const T = D.types, F = D.files, A = D.assets;

// reverse index: who uses each type, and each type's runtime index
const usedBy = T.map(() => []);
T.forEach((t, i) => t.out.forEach(([b, k]) => usedBy[b].push([i, k])));
const typesOfSys = {};
T.forEach((t, i) => { if (t.k === "rt") (typesOfSys[t.sys] = typesOfSys[t.sys] || []).push(i); });

// --- header ---------------------------------------------------------------------------------------------------------
const M = D.meta;
$("#lede").innerHTML = `Every runtime script of the game, what it uses and who uses it, the prefabs, scenes and data assets that hold it, and the tests that touch it. ` +
  `<b>${M.files}</b> scripts (${M.lines.toLocaleString()} lines) are read as text; Editor tools are left out. A system may use the systems below it; ` +
  `a <b style="color:var(--magenta)">pink</b> line is a reference that runs the other way, and each one is a place where changing one system forces a change in another.`;
const scoreSegs = [
  [M.files, "runtime scripts", "", "systems"], [M.types, "classes & types", "", "systems"], [M.so, "ScriptableObject classes", "", "data"],
  [M.uphill, "links running uphill", "bad", "problems"], [M.twoway, "pairs that use each other", "bad", "problems"],
  [M.back, "links to cut for a clean stack", "warn", "map"], [M.tangle, "classes in one tangle", "bad", "read"], [D.problems.length, "problems ranked", "warn", "problems"]];
$("#score").innerHTML = scoreSegs.map(([n, l, c, to]) => `<a class="seg ${c}" href="#${to}"><b>${n}</b><span>${l}</span></a>`).join("");
$("#foot").textContent = `Generated ${M.generated} by Tools/Editor/Architecture/Scripts~/dependency_map.py. Read the "How to read" view for what the map can and cannot see.`;

// --- views ----------------------------------------------------------------------------------------------------------
const VIEWS = [["map", "Map"], ["problems", "Problems"], ["systems", "Systems"], ["hubs", "Hubs"], ["data", "Design data"], ["tests", "Tests"], ["read", "How to read"]];
$("#tabs").innerHTML = VIEWS.map(([id, n]) => `<a class="tab" href="#${id}" data-v="${id}">${n}</a>`).join("");
let trail = [];
function show(view, arg, push = true) {
  if (push && current) trail.push(current);
  current = { view, arg };
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.v === view ? "page" : "false"));
  const v = $("#view");
  v.innerHTML = "";
  ({ map: viewMap, problems: viewProblems, systems: viewSystems, hubs: viewHubs, data: viewData, tests: viewTests, read: viewRead,
     sys: viewSystem, type: viewType, edge: viewEdge })[view](v, arg);
  if (push) window.scrollTo({ top: Math.min(window.scrollY, $(".bar").offsetTop), behavior: "auto" });
}
let current = null;
const backBtn = () => trail.length ? `<button class="tab back" data-act="back">← Back</button>` : "";
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (a === "back") { const h = trail.pop(); if (h) show(h.view, h.arg, false); }
  else if (a === "sys") show("sys", el.dataset.id);
  else if (a === "type") show("type", +el.dataset.id);
  else if (a === "edge") show("edge", el.dataset.id);
});
window.addEventListener("hashchange", () => route());
function route() {
  const h = (location.hash || "#map").slice(1);
  if (VIEWS.some(([id]) => id === h)) { trail = []; show(h, null, false); }
}

const sysLink = id => `<button class="link" data-act="sys" data-id="${esc(id)}">${esc(id)}</button>`;
const typeLink = i => `<button class="link" data-act="type" data-id="${i}">${esc(T[i].n)}</button>`;
const fileRef = (fi, ln, note) => `<div><span class="path">${esc(short(F[fi].p))}${ln ? ":" + ln : ""}</span>${note ? `<span>${esc(note)}</span>` : ""}</div>`;
const pips = n => `<span class="pips" title="impact ${n} of 5">${[1, 2, 3, 4, 5].map(i => `<span class="${i <= n ? "f" : ""}"></span>`).join("")}</span>`;
function meter(frac) { const c = frac < 0.25 ? "low" : frac < 0.5 ? "mid" : ""; return `<div class="meter ${c}"><span style="width:${Math.round(frac * 100)}%"></span></div>`; }
function sortable(table) {
  table.querySelectorAll("th[data-sort]").forEach((th, col) => th.addEventListener("click", () => {
    const idx = [...th.parentNode.children].indexOf(th), body = table.tBodies[0], num = th.classList.contains("n");
    const dir = th.dataset.dir === "asc" ? "desc" : "asc"; th.dataset.dir = dir;
    [...body.rows].sort((a, b) => {
      const x = a.cells[idx].dataset.v ?? a.cells[idx].textContent, y = b.cells[idx].dataset.v ?? b.cells[idx].textContent;
      const r = num ? (+x - +y) : x.localeCompare(y);
      return dir === "asc" ? r : -r;
    }).forEach(r => body.appendChild(r));
  }));
}

// --- Map ------------------------------------------------------------------------------------------------------------
let mapMode = "problem", mapSel = null;
function viewMap(v) {
  v.innerHTML = `<div class="stack">
    <div class="mapgrid">
      <section class="panel stack" style="padding:10px">
        <div class="row" style="justify-content:space-between;padding:4px 6px 0">
          <div class="row" role="group" aria-label="Which links">
            <button class="chip ${mapMode === "problem" ? "on" : ""}" data-mode="problem">Problem links</button>
            <button class="chip ${mapMode === "all" ? "on" : ""}" data-mode="all">All links</button>
          </div>
          <div class="legend"><span><i></i>uses (downhill, fine)</span><span><i class="back"></i>loop to cut</span><span><i class="up"></i>runs uphill</span>
            <span><i class="out"></i>selected uses</span><span><i class="in"></i>used by selected</span></div>
        </div>
        <div class="mapwrap" id="mapwrap"></div>
      </section>
      <aside class="panel side stack" id="side"></aside>
    </div>
  </div>`;
  v.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mapMode = b.dataset.mode; viewMap(v); });
  drawMap();
  sideInfo();
}
function layout() {
  const levels = {};
  D.systems.forEach(s => (levels[s.level] = levels[s.level] || []).push(s));
  const maxL = Math.max(...D.systems.map(s => s.level));
  const W = 1000, rowH = 74, top = 20, nodeW = 150, nodeH = 44, pos = {};
  Object.entries(levels).forEach(([l, list]) => {
    list.sort((a, b) => a.order - b.order);
    const gap = Math.min(40, (W - 90 - list.length * nodeW) / Math.max(1, list.length - 1));
    const total = list.length * nodeW + (list.length - 1) * gap;
    let x = 90 + (W - 90 - total) / 2;
    list.forEach(s => { pos[s.id] = { x, y: top + (maxL - l) * rowH, w: nodeW, h: nodeH }; x += nodeW + gap; });
  });
  return { pos, W, H: top + (maxL + 1) * rowH, maxL, rowH, top };
}
function drawMap() {
  const { pos, W, H, maxL, rowH, top } = layout();
  const maxLines = Math.max(...D.systems.map(s => s.lines));
  let bands = "", edges = "", hits = "", nodes = "";
  const rankAt = {};
  D.systems.forEach(s => { rankAt[s.level] = rankAt[s.level] || s.layer; });
  for (let l = maxL; l >= 0; l--) {
    const y = top + (maxL - l) * rowH;
    if ((maxL - l) % 2 === 0) bands += `<rect class="band" x="0" y="${y - 14}" width="${W}" height="${rowH}"></rect>`;
    bands += `<text class="lvl-label" x="6" y="${y + 26}">step ${l}</text>`;
  }
  const maxF = Math.max(...D.sysEdges.map(e => e.files));
  D.sysEdges.forEach((e, i) => {
    const a = pos[e.a], b = pos[e.b];
    if (!a || !b) return;
    const problem = e.back || e.uphill;
    const touches = mapSel && (e.a === mapSel || e.b === mapSel);
    if (mapMode === "problem" && !problem && !touches) return;
    let cls = "edge" + (e.uphill ? " up" : e.back ? " back" : "");
    if (touches && !problem) cls += e.a === mapSel ? " outsel" : " insel";
    const w = 1 + 4 * Math.sqrt(e.files / maxF);
    let op = problem ? 0.95 : touches ? 0.85 : mapSel ? 0.06 : 0.22;
    if (mapSel && problem && !touches) op = 0.25;
    const ax = a.x + a.w / 2, bx = b.x + b.w / 2;
    let d;
    if (a.y < b.y) d = `M${ax},${a.y + a.h} C${ax},${a.y + a.h + 40} ${bx},${b.y - 40} ${bx},${b.y}`;
    else if (a.y > b.y) d = `M${ax + 10},${a.y} C${ax + 70},${a.y - 50} ${bx + 70},${b.y + b.h + 50} ${bx + 10},${b.y + b.h}`;
    else { const yy = a.y + a.h, mid = (ax + bx) / 2; d = `M${ax},${yy} Q${mid},${yy + 36} ${bx},${yy}`; }
    edges += `<path class="${cls}" d="${d}" stroke-width="${w.toFixed(1)}" opacity="${op}"></path>`;
    hits += `<path class="edge-hit" d="${d}" data-edge="${i}"><title>${esc(e.a)} uses ${esc(e.b)}: ${e.files} file(s), ${e.types} type(s)</title></path>`;
  });
  D.systems.forEach(s => {
    const p = pos[s.id];
    const related = !mapSel || s.id === mapSel || D.sysEdges.some(e => (e.a === mapSel && e.b === s.id) || (e.b === mapSel && e.a === s.id));
    const bw = Math.max(3, (p.w - 4) * Math.sqrt(s.lines / maxLines));
    const name = s.id.replace("Gameplay/", "");
    nodes += `<g class="node ${s.id === mapSel ? "sel" : ""} ${related ? "" : "dim"}" data-node="${esc(s.id)}" tabindex="0" role="button" aria-label="${esc(s.id)}">
      <rect class="box" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="5"></rect>
      <rect class="size" x="${p.x + 2}" y="${p.y + p.h - 9}" width="${bw.toFixed(1)}" height="7" rx="1"></rect>
      <text x="${p.x + 8}" y="${p.y + 17}">${esc(name)}</text>
      <text class="sub" x="${p.x + 8}" y="${p.y + 31}">${s.files} files · ${(s.lines / 1000).toFixed(1)}k</text></g>`;
  });
  $("#mapwrap").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Systems stacked by layer, with the links between them">${bands}${edges}${hits}${nodes}</svg>`;
  $("#mapwrap").querySelectorAll("[data-node]").forEach(g => {
    const pick = () => { mapSel = mapSel === g.dataset.node ? null : g.dataset.node; drawMap(); sideInfo(); };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  $("#mapwrap").querySelectorAll("[data-edge]").forEach(p => p.addEventListener("click", () => show("edge", p.dataset.edge)));
}

  const so = T.map((t, i) => [t, i]).filter(([t]) => t.k === "rt" && t.role === "so").sort((a, b) => (b[0].soAssets || 0) - (a[0].soAssets || 0));
  const S = D.smells;
  const lines = arr => arr.map(([fi, n, s]) => `<div><span class="path">${esc(short(F[fi].p))}:${n}</span><code>${esc(s)}</code></div>`).join("");
  v.innerHTML = `<div class="stack">
    <section class="panel stack"><div class="prose"><h2>Design data</h2>
      <p>The game is meant to be tuned in the Editor through ScriptableObjects. This view shows how true that is: each ScriptableObject class, how many assets of it exist, how much runtime code reads it, and how the assets are wired in.
      Below it, the places where tuning still lives in code instead.</p></div>
      <div class="tablewrap"><table id="sotab"><thead><tr><th data-sort>Class</th><th data-sort>System</th><th data-sort class="n">Assets</th><th data-sort class="n">Runtime files reading it</th>
        <th data-sort class="n">Wired from prefabs</th><th data-sort class="n">from scenes</th><th data-sort class="n">from other assets</th></tr></thead>
      <tbody>${so.map(([t, i]) => `<tr><td>${typeLink(i)}</td><td>${esc(t.sys)}</td><td class="n">${t.soAssets || 0}</td><td class="n">${t.rip[0]}</td>
        <td class="n">${t.dataRefCount?.prefab || 0}</td><td class="n">${t.dataRefCount?.scene || 0}</td><td class="n">${t.dataRefCount?.asset || 0}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="panel stack"><h3>Gameplay numbers fixed in code (${S.hardcoded.reduce((n, h) => n + h.items.length, 0)})</h3>
      <p class="prose muted">Named constants in Gameplay runtime code. Ids, masks, sizes, <code>Default*</code> seeds for settings fields and 0/1 are left out. Some are engineering limits that belong in code; the rest a designer cannot change without a programmer.</p>
      ${S.hardcoded.map(h => `<details><summary>${esc(short(F[h.f].p))} <span class="num">(${h.items.length})</span></summary><div class="ev">${h.items.map(([n, k, val]) => `<div><span class="path">line ${n}</span><code>${esc(k)} = ${esc(val)}</code></div>`).join("")}</div></details>`).join("")}</section>
    <section class="panel stack"><h3>Settings fallbacks (${S.fallbacks.length})</h3><p class="prose muted">When the settings asset is missing the game silently runs on a second copy of the number kept in code. A wiring mistake hides, and the two copies drift.</p>
      <details><summary>All of them</summary><div class="ev">${lines(S.fallbacks)}</div></details></section>
    <section class="panel stack"><h3>Runtime writes to shared assets (${S.soWrites.length})</h3><p class="prose muted">A write to a ScriptableObject or to the render pipeline asset during Play changes the asset itself in the Editor. Fine when it is put back on exit (the graphics settings do that); a leak when it is not.</p>
      <details><summary>All of them</summary><div class="ev">${lines(S.soWrites)}</div></details></section>
    <section class="panel stack"><h3>Lookups by name (${S.strings.length})</h3><p class="prose muted">The compiler cannot see these; renaming or moving the target breaks them only at run time.</p><div class="ev">${lines(S.strings)}</div></section>
    <section class="panel stack"><h3>Static accessors that search on every call (${S.localGetComponent.length})</h3><div class="ev">${lines(S.localGetComponent)}</div></section>
    <section class="panel stack"><h3>FindObject calls in runtime code (${S.finds.length})</h3><details><summary>All of them</summary><div class="ev">${lines(S.finds)}</div></details></section>
  </div>`;
  sortable($("#sotab"));
}

// --- Tests ----------------------------------------------------------------------------------------------------------
function viewTests(v) {
  const rows = [...D.systems].sort((a, b) => (a.testable ? a.tested / a.testable : 0) - (b.testable ? b.tested / b.testable : 0));
  const untested = T.map((t, i) => [t, i]).filter(([t]) => t.k === "rt" && t.role !== "enum" && !t.tests.length).sort((a, b) => b[0].rip[0] - a[0].rip[0]).slice(0, 40);
  v.innerHTML = `<div class="stack">
    <section class="panel stack"><div class="prose"><h2>Tests</h2>
      <p>A class counts as touched when a test file names it. That says a test exists nearby, not that every path is covered. ${M.testFiles} test scripts in ${new Set(F.filter(f => f.k === "test").map(f => f.a)).size} test assemblies, all EditMode.
      Before a refactor moves a class, it should be touched by a test, so the move can be checked without opening the game.</p></div>
      <div class="tablewrap"><table><thead><tr><th>System</th><th>Classes touched by a test</th><th class="n">Test files</th></tr></thead>
      <tbody>${rows.map(s => `<tr><td>${sysLink(s.id)}</td><td><div class="row" style="flex-wrap:nowrap">${meter(s.testable ? s.tested / s.testable : 0)}<span class="num muted">${s.tested} of ${s.testable}</span></div></td><td class="n">${s.testFiles}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="panel stack"><h3>Most-used classes no test touches</h3>
      <div class="tablewrap"><table><thead><tr><th>Class</th><th>System</th><th class="n">Files using it</th><th class="n">Reached through others</th></tr></thead>
      <tbody>${untested.map(([t, i]) => `<tr><td>${typeLink(i)}</td><td>${esc(t.sys)}</td><td class="n">${t.rip[0]}</td><td class="n">${t.rip[2]}</td></tr>`).join("")}</tbody></table></div></section>
  </div>`;
}

// --- How to read ----------------------------------------------------------------------------------------------------
function viewRead(v) {
  v.innerHTML = `<section class="panel stack"><div class="prose">
    <h2>How to read the map</h2>
    <h3>Layers</h3>
    <p>${D.meta.ranks.map(r => `<b>${esc(r.name)}</b>: ${r.members.map(esc).join(", ")}`).join(". ")}. A system may use its own layer and the ones below.
      This follows the rules in <code>_Docs/ProjectOrganization.md</code> section 4: Core knows nothing of gameplay, gameplay never knows its presentation, presentation observes gameplay.</p>
    <h3>Steps</h3>
    <p>Inside a layer the systems are ordered so that as few links as possible point backwards. The map draws them as steps, step 0 at the bottom. A grey line goes down a step: fine.
      A pink line goes up: either it runs <b>uphill</b> into a higher layer (dashed), or it closes a <b>loop</b> between systems of the same layer (solid). The loops are the reason the big
      <code>KryticalNova.Runtime</code> assembly cannot be split per system yet; cutting the pink links is the work that makes it possible.</p>
    <h3>Ripple</h3>
    <p>For each class: the files that use it directly, the systems they sit in, and the types that reach it through others. A class with a large ripple is expensive to change and needs tests before it moves.</p>
    <h3>The tangle</h3>
    <p><b>${M.tangle}</b> classes all reach each other through some chain of uses: ${Object.entries(M.tangleSys).map(([s, n]) => `${esc(s.replace("Gameplay/", ""))} ${n}`).join(", ")}.
      That is why so many classes show about the same number of types reaching them through others: inside the tangle, a change can in principle travel to every member.
      Cutting the pink links shrinks it, and each system that falls out of it can get an assembly of its own. A class page marks its members "in the tangle".</p>
    <h3>How a link is found</h3>
    <p>The script reads every runtime and test <code>.cs</code> file as text, strips comments and strings, and resolves every name against the classes the project declares, through each file's namespace and <code>using</code> lines.
      It marks how a class is used: inherits, serialized field (designer wiring), GetComponent, static access, FindObject, or plain use. Assets are read as Unity text YAML: <code>m_Script</code> GUIDs say which script a prefab, scene or data asset holds;
      other GUIDs say which data assets they point at; <code>[SerializeReference]</code> entries name a class and assembly as text.</p>
    <h3>What it cannot see</h3>
    <p>It is not the compiler. It misses links made through reflection or strings (listed under Design data), UnityEvents wired in the Inspector, links in Editor code (left out on purpose) and references that only go through an interface or a base class.
      A simple name that two namespaces both declare is skipped rather than guessed. Counts can be off by a little; every link it does show names the file and line, so it can be checked.</p>
    <h3>Re-run it</h3>
    <p>From the project folder: <code>python "Assets/_Game/Tools/Editor/Architecture/Scripts~/dependency_map.py"</code> (a few seconds, Unity can stay closed).
      <code>--baseline</code> saves today's uphill links and two-way pairs; <code>--check</code> fails when a new one appears, so a refactor cannot quietly add one back.
      The written report is <code>_Docs/Reference/Dependency-Map.md</code> and the plan to fix it is <code>_Docs/Plans/architecture-decoupling-plan.md</code>.</p>
  </div></section>`;
}

// --- search ---------------------------------------------------------------------------------------------------------
const q = $("#q"), results = $("#results");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  if (s.length < 2) { results.hidden = true; return; }
  const hits = [];
  D.systems.forEach(x => { if (x.id.toLowerCase().includes(s)) hits.push([0, "system", x.id, () => show("sys", x.id)]); });
  T.forEach((t, i) => { if (t.k === "rt" && t.n.toLowerCase().includes(s)) hits.push([t.n.toLowerCase() === s ? -1 : t.n.toLowerCase().startsWith(s) ? 1 : 2, ROLE[t.role] === "class" ? "class" : t.role === "so" ? "data" : t.role, t.n + "  ·  " + t.sys, () => show("type", i)]); });
  F.forEach((f, fi) => { if (f.k === "rt" && f.p.toLowerCase().includes(s)) { const t = T.findIndex(t => t.f.includes(fi)); if (t >= 0) hits.push([3, "file", short(f.p), () => show("type", t)]); } });
  hits.sort((a, b) => a[0] - b[0]);
  const top = hits.slice(0, 14);
  results.innerHTML = top.length ? top.map((h, j) => `<button data-hit="${j}"><span class="kind">${esc(h[1])}</span><span>${esc(h[2])}</span></button>`).join("") : `<div style="padding:8px 12px" class="muted">Nothing matches "${esc(q.value)}".</div>`;
  results.hidden = false;
  results.querySelectorAll("[data-hit]").forEach(b => b.onclick = () => { results.hidden = true; q.value = ""; top[+b.dataset.hit][3](); });
});
q.addEventListener("keydown", e => { if (e.key === "Enter") { const b = results.querySelector("[data-hit]"); if (b) b.click(); } if (e.key === "Escape") results.hidden = true; });
document.addEventListener("click", e => { if (!e.target.closest(".searchwrap")) results.hidden = true; });

route();
</script>
